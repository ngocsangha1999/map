                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#BFC9DD" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.2 3H8.4C7.41 3 6.6 3.81 6.6 4.8V18.3C6.6 18.84 6.15 19.2 5.7 19.2C5.25 19.2 4.8 18.84 4.8 18.3V8.4C4.8 7.95 4.35 7.5 3.9 7.5C3.45 7.5 3 7.95 3 8.4V19.2C3 20.19 3.81 21 4.8 21H19.2C20.19 21 21 20.19 21 19.2V4.8C21 3.81 20.19 3 19.2 3ZM14.7 12H9.3C8.85 12 8.4 11.64 8.4 11.1C8.4 10.65 8.85 10.2 9.3 10.2H14.7C15.15 10.2 15.6 10.65 15.6 11.1C15.6 11.64 15.15 12 14.7 12ZM18.3 8.4H9.3C8.85 8.4 8.4 8.04 8.4 7.5C8.4 7.05 8.85 6.6 9.3 6.6H18.3C18.75 6.6 19.2 7.05 19.2 7.5C19.2 8.04 18.75 8.4 18.3 8.4Z" />
                    </svg>
                    <div class="title-menu">Nét xưa chốn Thị thành</div>
                </div>

    </div>

</body>
<script src="./static/js/owl.carousel.min.js "></script>
<script src="./static/js/mobile_places.js?v=6"></script>
<script src="./static/js/mobile_scripts.js?v=3"></script>

<script>
    var current_zoom=0;
    var id_floor=null;
    var delayTime = 6000;

    var tile_mh=$(window).height()/$(window).width()
    if(tile_mh<2){
        $('.map').css( {'background': 'url(./static/images/map/map_mobile1.png) no-repeat bottom'});
        $('.map').css({'background-size':'100vw auto'});

    }
      $('#loader').show();
    $('#web').hide();
    window.onload = function() {
        setTimeout(function(){ 
            localStorage.setItem("check_icon",0);
            $('#web').show();
            $('#loader').hide();
 
            initPage();
            localStorage.removeItem("key");
            localStorage.setItem("load",1);
        }, 2000);

    };


    $(document).ready(function () {
    var isMobile = false; //initiate as false
    if (!(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))) {
      window.location.href = "./map.html"
    }
    var owl = $('.owl-carousel');
   owl.owlCarousel({
     items: 2,
     loop: true,
     margin: 10,
     autoplay: false,
     autoplayTimeout: 1000,
     autoplayHoverPause: false
   });

  })

    // ---------------- 3 tab: dữ liệu lấy từ static/js/mobile_places.js ----------------
    // Ảnh nền mobile lấy dải x = 175..1445 của tranh gốc (rộng 1545px, bỏ ruộng hai bên),
    // phóng thành rộng 100vw, cao 902/1125 chiều rộng; nền cam bù phía dưới cao 233px (ảnh 1368)
    // hoặc 149px (ảnh 1200). Toạ độ x, y trong dữ liệu vẫn tính theo tranh gốc.
    var ART_SRC_WIDTH = 1545, ART_CROP_LEFT = 175, ART_CROP_WIDTH = 1270;
    var ART_HEIGHT_VW = 902 / 1125 * 100;
    // Dời ảnh nền xuống, che bớt dải cam phía dưới để có chỗ cho nhãn ghim ở mép trên.
    var ART_SHIFT_VW = tile_mh < 2 ? 7 : 10;
    $('.map').css('background-position', 'center bottom -' + ART_SHIFT_VW + 'vw');
    var ART_BOTTOM_VW = (tile_mh < 2 ? 149 : 233) / 1125 * 100 - ART_SHIFT_VW;
    var current_tab = MOBILE_TABS[0].id;

    function findPlace(id) {
        for (let t of MOBILE_TABS) {
            for (let p of t.places) {
                if (p.id == id) return p;
            }
        }
        return null;
    }

    function renderTabs() {
        let panels = '';
        let pins = '';
        MOBILE_TABS.forEach(function(tab, k) {
            panels += '<div class="content-bottom content-map tab-panel" data-tab="' + tab.id + '"' + (k ? ' style="display:none"' : '') + '>'
                + '<div class="title-content-bottom main-menu">' + tab.title + '</div>'
                + '<div class="parent-menu-content main-menu">';
            tab.places.forEach(function(p, i) {
                if (i) panels += '<div class="line-menu"></div>';
                panels += '<div class="menu-content-bottom place-item" data-place="' + p.id + '">'
                    + '<div class="container-menu-bottom"><div class="text-container-menu">' + p.name + '</div>'
                    + '<img src="./static/images/map/icon/btn-next.svg" alt=""></div></div>';
                let left = (p.x / 100 * ART_SRC_WIDTH - ART_CROP_LEFT) / ART_CROP_WIDTH * 100;
                let bottom = ART_BOTTOM_VW + (100 - p.y) / 100 * ART_HEIGHT_VW;
                pins += '<div class="over people btnFile place-pin' + (tab.id != current_tab ? ' other-tab' : '') + '" data-tab="' + tab.id + '" data-place="' + p.id + '" data-pos="' + p.x + ',' + p.y + '"'
                    // vòng sáng của ghim nằm cao hơn gốc 25px, dời xuống để vòng trùng đúng vị trí
                    + ' style="left:' + left.toFixed(2) + 'vw;bottom:calc(' + bottom.toFixed(2) + 'vw - 25px);">'
                    + '<div class="typewriter"><h6>' + p.name + '</h6></div>'
                    + '<div class="pop"><img src="./static/images/map/pin.png" alt=""></div>'
                    + '<div class="effect" style="display: none;"><span></span><span></span></div></div>';
            });
            panels += '</div></div>';
        });
        $('#tab-panels').html(panels);
        $('.map').append(pins);
        selectTab(current_tab);
    }

    function resetPins() {
        $('.place-pin').removeClass('active');
        $('.place-pin .effect').hide();
        $('.place-pin .typewriter').removeClass('active');
        $('.place-pin .pop').removeClass('active');
    }

    function selectTab(tab_id) {
        current_tab = tab_id;
        let taken = {};
        $('.place-pin[data-tab="' + tab_id + '"]').each(function() { taken[$(this).data('pos')] = true; });
        $('.place-pin').each(function() {
            let other = $(this).data('tab') != tab_id;
            $(this).toggleClass('other-tab', other);
            $(this).removeClass('same-spot');
            if (!other) return;
            // công trình đã có ghim (ưu tiên tab đang chọn) thì ẩn ghim trùng chỗ, tránh chồng nhau
            let pos = $(this).data('pos');
            $(this).toggleClass('same-spot', !!taken[pos]);
            taken[pos] = true;
        });
        $('.tab-circle').removeClass('current-circle');
        $('.tab-circle .title-menu').css('color', '#7988A4');
        let circle = $('.tab-circle[data-tab="' + tab_id + '"]');
        circle.addClass('current-circle');
        circle.find('.title-menu').css('color', '#E23C47');
    }

    function showTab(tab_id) {
        selectTab(tab_id);
        localStorage.setItem("check_icon", 0);
        resetPins();
        $('.place-detail').hide();
        $('.tab-panel').hide();
        $('.tab-panel[data-tab="' + tab_id + '"]').show();
    }

    function showPlace(place_id) {
        let p = findPlace(place_id);
        if (!p) return;
        // bấm ghim của tab khác thì chuyển sang tab đó
        selectTab($('.place-pin[data-place="' + place_id + '"]').data('tab'));
        localStorage.setItem("check_icon", 1);
        resetPins();
        let pin = $('.place-pin[data-place="' + place_id + '"]');
        pin.addClass('active');
        pin.find('.effect').show();
        pin.find('.typewriter').addClass('active');
        pin.find('.pop').addClass('active');

        $('#place-name').text(p.name);
        $('#place-image').attr({ src: p.image, alt: p.name });
        // có link Sketchfab thì nhúng mô hình 3D thay cho ảnh
        let m = (p.model3d || '').match(/([0-9a-f]{32})\/?$/);
        if (m) {
            $('#place-model').attr({ src: 'https://sketchfab.com/models/' + m[1] + '/embed?autostart=1&ui_hint=0', title: p.name + ' 3D' }).show();
            $('#place-image').hide();
        } else {
            $('#place-model').attr('src', 'about:blank').hide();
            $('#place-image').show();
        }
        // dừng audio của điểm trước, có file thuyết minh thì hiện trình phát
        $('#place-audio')[0].pause();
        if (p.audio) $('#place-audio').attr('src', p.audio).show();
        else $('#place-audio').removeAttr('src').hide();
        $('#place-text').text(p.text);
        $('.tab-panel').hide();
        $('.place-detail').show();
    }

    renderTabs();
    $('.tab-circle .title-menu').first().css('color', '#E23C47');
    $('.tab-circle').click(function() { showTab($(this).data('tab')); });
    $('#tab-panels').on('click', '.place-item', function() { showPlace($(this).data('place')); });
    $('.map').on('click', '.place-pin', function() { showPlace($(this).data('place')); });
    $('.place-back').click(function() {
        $('#place-audio')[0].pause();
        $('#place-model').attr('src', 'about:blank');
        showTab(current_tab);
    });
</script>
</html>
