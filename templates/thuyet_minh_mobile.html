<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Thuyết minh</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        margin: 0;
        height: 100%;
        background: #FCFDFE;
        font-family: "Roboto", sans-serif;
        color: #283352;
        -webkit-tap-highlight-color: transparent;
    }
    .page {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .header {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 12px 16px;
        flex: none;
    }
    .header img {
        width: 24px;
        cursor: pointer;
    }
    .title {
        text-align: center;
        font-size: 20px;
        font-weight: 500;
        line-height: 26px;
    }
    .subtitle {
        text-align: center;
        font-size: 12px;
        color: #7988A4;
    }

    /* khung ảnh: các ảnh chồng lên nhau, ảnh đang chọn hiện dần */
    .slides {
        position: relative;
        flex: none;
        width: 100%;
        height: 66vw;
        max-height: 50vh;
        background: #1c2133;
        overflow: hidden;
        touch-action: pan-y;
    }
    .slides img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .6s;
    }
    .slides img.active {
        opacity: 1;
    }
    .slide-nav {
        position: absolute;
        top: 50%;
        width: 40px;
        height: 40px;
        margin-top: -20px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, .35);
        color: #fff;
        font-size: 22px;
        line-height: 40px;
        padding: 0;
        cursor: pointer;
    }
    .slide-nav:disabled {
        opacity: .25;
    }
    .slide-nav.prev { left: 10px; }
    .slide-nav.next { right: 10px; }
    .slide-count {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 2px 10px;
        border-radius: 12px;
        background: rgba(0, 0, 0, .45);
        color: #fff;
        font-size: 13px;
    }
    .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 10px 0 0;
        flex: none;
    }
    .dots span {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: #D5DBE6;
        transition: width .3s, background .3s;
    }
    .dots span.active {
        width: 20px;
        background: #E23C47;
    }

    .player {
        width: calc(100% - 32px);
        margin: 12px 16px;
        flex: none;
    }
    /* phần chữ: đoạn đang đọc đậm màu, các đoạn khác mờ đi; chạm một đoạn để nghe từ đó */
    .text {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 24px;
    }
    .text p {
        margin: 0 0 10px;
        padding: 8px 10px;
        border-left: 3px solid transparent;
        border-radius: 4px;
        text-indent: 1.5em;
        font-size: 16px;
        line-height: 24px;
        text-align: justify;
        color: #9AA3B5;
        cursor: pointer;
        transition: color .3s, background .3s, border-color .3s;
    }
    .text p.active {
        color: #283352;
        background: #FDF0F1;
        border-left-color: #E23C47;
    }
    .next-place {
        display: none;
        width: 100%;
        height: 44px;
        margin-top: 4px;
        border: none;
        border-radius: 22px;
        background: #E23C47;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
    }
    .empty {
        padding: 40px 16px;
        text-align: center;
        color: #7988A4;
    }
</style>
</head>
<body>
<div class="page">
    <div class="header">
        <img id="back" src="./static/images/map/icon/btn-back.svg" alt="Quay lại">
        <div>
            <div class="title" id="name"></div>
            <div class="subtitle" id="route"></div>
        </div>
        <div></div>
    </div>
    <div class="slides" id="slides">
        <button type="button" class="slide-nav prev" id="prev" aria-label="Ảnh trước">‹</button>
        <button type="button" class="slide-nav next" id="next" aria-label="Ảnh sau">›</button>
        <div class="slide-count" id="count"></div>
    </div>
    <div class="dots" id="dots"></div>
    <audio class="player" id="audio" controls preload="metadata"></audio>
    <div class="text" id="text">
        <button type="button" class="next-place" id="next-place"></button>
    </div>
</div>

<script src="./static/js/mobile_places.js?v=8"></script>
<script>
    var params = new URLSearchParams(location.search);
    var place = null, tab = null;
    MOBILE_TABS.forEach(function(t) {
        t.places.forEach(function(p) {
            if (p.id == params.get('place')) { place = p; tab = t; }
        });
    });

    document.getElementById('back').onclick = function() {
        // mở đè trên bản đồ thì nhờ bản đồ đóng lại; mở từ trang khác thì quay lại, mở thẳng link thì về bản đồ
        if (window.parent != window) window.parent.postMessage({ type: 'close-slides' }, location.origin);
        else if (document.referrer.indexOf(location.origin) == 0 && history.length > 1) history.back();
        else location.href = './map_mobile.html';
    };

    if (!place) {
        document.getElementById('name').textContent = 'Không tìm thấy địa điểm';
        document.getElementById('text').innerHTML = '<div class="empty">Địa điểm không tồn tại.</div>';
    } else {
        start();
    }

    function start() {
        var audio = document.getElementById('audio');
        var paras = place.text.split('\n');
        // đoạn cuối của bài thường mời sang điểm kế tiếp trong tuyến, nên mặc định lấy ảnh điểm đó
        var nextPlace = tab.places[tab.places.indexOf(place) + 1];
        var images = paras.map(function(s, i) {
            if (place.slides && place.slides[i]) return place.slides[i];
            if (i > 0 && i == paras.length - 1 && nextPlace) return nextPlace.image;
            return place.image;
        });
        var cues = place.cues || null;
        var current = -1;

        document.title = place.name + ' - Thuyết minh';
        document.getElementById('name').textContent = place.name;
        document.getElementById('route').textContent = tab.title;

        var box = document.getElementById('slides');
        var dots = document.getElementById('dots');
        var text = document.getElementById('text');
        images.forEach(function(src, i) {
            var img = document.createElement('img');
            img.src = src;
            img.alt = place.name + ' - ảnh ' + (i + 1);
            box.insertBefore(img, box.firstChild);
            dots.appendChild(document.createElement('span'));
        });
        var imgs = box.querySelectorAll('img');
        paras.forEach(function(s, i) {
            var p = document.createElement('p');
            p.textContent = s;
            p.onclick = function() { go(i, true); };
            text.insertBefore(p, document.getElementById('next-place'));
        });

        // ảnh được chèn ngược thứ tự (để nằm dưới nút), nên ảnh thứ i là imgs[n - 1 - i]
        function show(i) {
            if (i == current) return;
            current = i;
            imgs.forEach(function(img, k) { img.classList.toggle('active', imgs.length - 1 - k == i); });
            dots.querySelectorAll('span').forEach(function(d, k) { d.classList.toggle('active', k == i); });
            text.querySelectorAll('p').forEach(function(p, k) { p.classList.toggle('active', k == i); });
            document.getElementById('count').textContent = (i + 1) + ' / ' + paras.length;
            document.getElementById('prev').disabled = i == 0;
            document.getElementById('next').disabled = i == paras.length - 1;
            var p = text.querySelectorAll('p')[i];
            text.scrollTo({ top: p.offsetTop - text.offsetTop - 8, behavior: 'smooth' });
        }

        // chuyển ảnh bằng tay thì tua audio tới đầu đoạn tương ứng
        function go(i, seek) {
            if (i < 0 || i >= paras.length) return;
            show(i);
            // cộng thêm chút để audio làm tròn thời gian không rơi về đoạn trước
            if (seek && cues) audio.currentTime = cues[i] + 0.05;
        }

        // không có mốc thời gian sẵn thì chia thời lượng audio theo độ dài chữ của từng đoạn
        function estimateCues() {
            if (cues || !isFinite(audio.duration)) return;
            var total = paras.reduce(function(s, p) { return s + p.length; }, 0);
            var acc = 0;
            cues = paras.map(function(p) {
                var t = acc / total * audio.duration;
                acc += p.length;
                return t;
            });
            // đã chuyển ảnh bằng tay trước khi audio tải xong thì bắt đầu nghe từ đoạn đó
            if (current > 0 && audio.currentTime == 0) audio.currentTime = cues[current] + 0.05;
        }

        audio.src = place.audio;
        audio.addEventListener('loadedmetadata', estimateCues);
        audio.addEventListener('timeupdate', function() {
            if (!cues) return;
            var i = 0;
            while (i + 1 < cues.length && audio.currentTime >= cues[i + 1]) i++;
            show(i);
        });

        // hết bài thì gợi ý sang điểm kế tiếp trong cùng tuyến
        var nextBtn = document.getElementById('next-place');
        if (nextPlace) {
            nextBtn.textContent = 'Điểm tiếp theo: ' + nextPlace.name + ' ›';
            nextBtn.onclick = function() {
                location.replace('./thuyet_minh_mobile.html?place=' + nextPlace.id);
            };
        }
        audio.addEventListener('ended', function() {
            if (nextPlace) nextBtn.style.display = 'block';
        });

        document.getElementById('prev').onclick = function() { go(current - 1, true); };
        document.getElementById('next').onclick = function() { go(current + 1, true); };
        var touchX = null;
        box.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, { passive: true });
        box.addEventListener('touchend', function(e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1), true);
            touchX = null;
        });

        show(0);
    }
</script>
</body>
</html>
